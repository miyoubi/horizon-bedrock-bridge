[package]
name = "bedrock-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "A Bedrock Edition protocol client and translator for Horizon (Minecraft: Java Edition in Rust)"

# Every dependency below is a plain registry requirement that already exists in
# Horizon's Cargo.lock, which is the native-mod bundle allow list. The crate is
# staged as a workspace member and depends on no path or git crate, so the modded
# game still builds with `--locked`.
[dependencies]
ring = "0.17.14"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
curve25519-dalek = "4.1.3"
base64 = "0.22.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0.69"
sha2 = "0.10.9"
hmac = "0.12.1"
indexmap = "2.14.2"
hkdf = "0.12.4"
subtle = "2.6.1"
zeroize = "1.9.1"
log = "0.4.34"
# WebRTC (webrtc-rs, sans-I/O), for the NetherNet transport. Horizon's lock has
# carried this since the revision that permits native mods to use WebRTC, and
# horizon-mixins allows a bundle crate only what that lock holds. A bundle's
# crate is added to the dependent without features, so this is on by default;
# `--no-default-features` keeps the portable layers light for local testing.
rtc = { version = "0.21", optional = true }
bytes = { version = "1.12.1", optional = true }

[features]
# Builds the WebRTC driver alongside the RakNet one, so the mod speaks both.
default = ["nethernet-webrtc"]
nethernet-webrtc = ["dep:rtc", "dep:bytes"]

[[example]]
name = "netherjoin"
path = "examples/netherjoin.rs"
required-features = ["nethernet-webrtc"]

[[example]]
name = "netherjoin_auth"
path = "examples/netherjoin_auth.rs"
required-features = ["nethernet-webrtc"]
